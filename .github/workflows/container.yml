name: Container

on:
  pull_request:
    paths:
      - .github/workflows/container.yml
      - .dockerignore
      - Dockerfile.alpine
      - scripts/docker-entrypoint-alpine.sh
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve checked-out source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse --verify 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=alpine,enable={{is_default_branch}}
            type=ref,event=tag,prefix=alpine-
            type=sha,prefix=alpine-

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.alpine
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          build-args: |
            APPWEAVER_GIT_SHA=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
